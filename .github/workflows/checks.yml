name: Checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:helper
      - run: npm run build
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          cp .dev.vars.example .dev.vars
          npm run db:local
      - name: Exercise the browser workflows
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          npm run dev > /tmp/blai-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/api/health > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/blai-dev.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/api/health
          npm run test:e2e
      - name: Upload development server logs after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-server-log
          path: /tmp/blai-dev.log
